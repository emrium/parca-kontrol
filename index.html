<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parça Kontrol – Eksik Parça Kontrolü</title>
<style>
  body { margin: 0; background: #1c1f24; color: #e8e8e8; font-family: system-ui, sans-serif; }
  #bilgi {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 12px 16px; font-size: 14px; line-height: 1.4; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #durum {
    position: absolute; top: 84px; left: 0; right: 0; text-align: center;
    font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #sonuc {
    position: absolute; top: 110px; left: 12px; right: 12px;
    font-size: 14px; line-height: 1.5; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #sonuc .tamam { color: #7CFC9A; }
  #sonuc .eksik { color: #FF7B72; font-weight: 600; }
  #hataAyik {
    position: absolute; right: 8px; bottom: 96px; width: 120px; height: auto;
    border: 1px solid rgba(255,255,255,.6); background: #000; display: none;
  }
  #arac {
    position: absolute; bottom: 24px; left: 0; right: 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px;
  }
  #arac button {
    padding: 11px 16px; font-size: 14px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,.9); color: #1c1f24;
  }
  #arac button:disabled { opacity: .4; }
  #basla { background: #2ecc71; font-weight: 600; }
  #kontrol { background: #ffd54a; font-weight: 600; }
  #canli.acik { background: #ffd54a; font-weight: 600; }
  #ogret { background: #9ad0ff; }
  #ayarPanel { display: none; position: absolute; bottom: 150px; left: 0; right: 0; text-align: center; }
  #ayarPanel.acik { display: block; }
  #ayarPanel .satir { display: flex; justify-content: center; gap: 6px; margin: 4px 0; }
  #ayarPanel button { padding: 8px 12px; font-size: 13px; border: 0; border-radius: 6px; background: rgba(255,255,255,.85); color: #1c1f24; }
  #ayarPanel .okuma { font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.8); margin-bottom: 4px; }
  .gizli { display: none !important; }
</style>
</head>
<body>
<div id="bilgi">Model yükleniyor...</div>
<div id="durum"></div>
<div id="sonuc"></div>
<canvas id="hataAyik" width="160" height="120"></canvas>
<div id="ayarPanel">
  <div class="okuma" id="ayarOkuma"></div>
  <div class="satir"><button data-eksen="x" data-yon="-1">◀ Sol</button><button data-eksen="x" data-yon="1">Sağ ▶</button></div>
  <div class="satir"><button data-eksen="z" data-yon="-1">▲ İşarete yaklaş</button><button data-eksen="z" data-yon="1">▼ İşaretten uzaklaş</button></div>
  <div class="satir"><button data-eksen="y" data-yon="1">⬆ Yükselt</button><button data-eksen="y" data-yon="-1">⬇ Alçalt</button><button id="ayarSifirla">Sıfırla</button></div>
</div>
<div id="arac">
  <button id="basla">AR'ı başlat</button>
  <button id="ayar" class="gizli">Ayar</button>
  <button id="kontrol" class="gizli" disabled>Kontrol et</button>
  <button id="canli" class="gizli" disabled>Canlı</button>
  <button id="ogret" class="gizli" disabled>Öğret</button>
  <button id="ogretSil" class="gizli">Öğretimi sil</button>
  <button id="kilitle" class="gizli" disabled>İşarete kilitle</button>
  <button id="dondur" class="gizli" disabled>Döndür 15°</button>
  <button id="kaldir" class="gizli" disabled>Kaldır</button>
  <button id="cik" class="gizli">Çık</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

// ---- Ayarlar ---------------------------------------------------------
const SURUM = 15;                 // her yeni dosyada artar; ekranda görünür, doğru dosyanın yüklendiğini gösterir
const MODEL_OBJ = 'parca.obj';
const MODEL_MTL = 'parca.mtl';
const MODEL_OLCEK = 0.001;        // model mm ise 0.001 (Three.js metre kullanır)

const ISARET_DOSYA = 'isaret.png';
const ISARET_GENISLIK_MM = 100;   // kağıttaki işaretin cetvelle ölçülen dış genişliği
const PARCA_OFSET_MM = 100;       // işaret merkezinden parça yerinin merkezine, sayfada aşağı doğru (%100 baskıda)

const ORNEK_SAYISI = 90;          // kilitlemeden önce toplanacak iyi ölçüm sayısı (~2 s)
const MIN_KAMERA_YOLU_M = 0.04;   // ölçümler en az 4 cm'lik kamera hareketi boyunca alınmalı: tek bakış açısının
                                  // sistematik hatası böyle ortalanır ("telefonu yavaşça hafif gezdir")
const SISTEMATIK_DUZELTME = { x: 0, y: -4, z: 0 }; // mm; iki ayrı kilitte de gereken düzeltme, kalıcı olarak uygulanır
const YENIDEN_KILIT_M = 0.012;    // iyi görüş koşullarında işaret, kilitli konumdan bu kadar (12 mm) uzakta görülürse yeniden kilitle
const YENIDEN_KILIT_KARE = 45;    // ... ve bu sapma en az bu kadar (iyi) kare art arda sürmeli
const MODEL_SEFFAFLIK = 0.6;      // model yarı saydam çizilir ki gerçek parça altından görünsün, kayma fark edilsin
const ZEMIN_YUKSEKLIGINI_KULLAN = false; // true: yükseklik ARCore düzleminden; false: işaretin kendi ölçümünden (daha doğru çıktı)
const AYAR_ADIMI_MM = 2;          // ince ayar düğmelerinin her basışta kaydırdığı miktar
const ISARET_YATAY = true;        // işaret yatay bir masada duruyor: normali yukarı bakmayan ölçümler elenir
const MAKS_EGIM_DERECE = 20;      // işaret normali ile "yukarı" arasındaki izin verilen en büyük açı
// Ölçüm kalite süzgeci: kilit yalnızca iyi görüş koşullarında alınan ölçümlerle yapılır
const MAKS_MESAFE_M = 0.60;       // kamera-işaret uzaklığı en fazla 60 cm
const MAKS_BAKIS_ACISI = 35;      // işaret normali ile bakış doğrultusu arası en fazla 35° (tepeden bakış = 0°)
const MERKEZ_SINIRI = 0.6;        // işaret merkezi görüntünün orta %60'lık alanında olmalı (-0.6..0.6)
const TUTARLILIK_MM = 10;         // ölçümlerin konumları ortancadan en fazla bu kadar sapmalı (farklı açılardan ölçüm normal olarak biraz yayılır)
const TUTARLILIK_ORAN = 0.8;      // ölçümlerin en az %80'i yönelim olarak birbiriyle uyumlu olmalı
const MAKS_BEKLEME_KARE = 300;    // ~5 s içinde tutarlılık sağlanamazsa eldeki en iyi ölçümle kilitle

// ---- Kontrol bölgeleri -----------------------------------------------
// Koordinatlar model uzayında, mm; orijin modelin TABAN MERKEZİ (uygulama modeli böyle yerleştirir).
// Her bölge: ad, merkez konumu, yüzey normali (kameraya bakıyor mu diye), beklenen renk.
// Gerçek parçada bu liste CAD'den üretilecek; küp için 3 görünür yüzün 9'ar etiketi.
const BOLGE_YARICAP_MM = 3.5;     // her bölgede örneklenen dairenin yarıçapı (etiket 15,6 mm; küçük yarıçap birkaç mm kaymayı tolere eder)
const P = 55 / 3;
const BOLGELER = [];
{
  let n = 0;
  for (const k of [-1, 0, 1]) for (const i of [-1, 0, 1])   // üst yüz (+Y): beyaz
    BOLGELER.push({ ad: `üst ${++n}`, konum: [i * P, 55, k * P], normal: [0, 1, 0], renk: 'beyaz' });
  n = 0;
  for (const j of [1, 0, -1]) for (const i of [-1, 0, 1])   // ön yüz (+Z, alt kenara bakan): yeşil
    BOLGELER.push({ ad: `ön ${++n}`, konum: [i * P, 27.5 + j * P, 27.5], normal: [0, 0, 1], renk: 'yesil' });
  n = 0;
  for (const j of [1, 0, -1]) for (const k of [1, 0, -1])   // sağ yüz (+X): kırmızı
    BOLGELER.push({ ad: `sağ ${++n}`, konum: [27.5, 27.5 + j * P, k * P], normal: [1, 0, 0], renk: 'kirmizi' });
}
// Renk kararı: nötr renkler doygunluk/parlaklıkla, diğerleri ton açısıyla (0-360) değerlendirilir
const RENKLER = {
  beyaz:   { notr: true, minV: 0.40, maxS: 0.40 },
  sari:    { ton: 55,  tol: 22 },
  turuncu: { ton: 25,  tol: 14 },
  kirmizi: { ton: 0,   tol: 16 },
  yesil:   { ton: 130, tol: 40 },
  mavi:    { ton: 220, tol: 40 },
};
const MIN_DOYGUNLUK = 0.22;       // renkli etiket için en az doygunluk (siyah bant/boşluk bunun altında kalır)
const MIN_PARLAKLIK = 0.18;
// Öğretilmiş referansla karşılaştırma (Öğret düğmesiyle sağlam parçadan alınan renkler)
const KROMA_ESIGI = 0.08;         // renk oranlarında (r,g)/(r+g+b) izin verilen fark; ışık şiddetinden bağımsız
const PARLAKLIK_ORAN_MIN = 0.50;  // örneğin parlaklığı (genel ışık düzeltmesinden sonra) referansın en az %50'si olmalı
const PARLAKLIK_ORAN_MAKS = 2.2;  // ... ve en fazla 2,2 katı (parlama)
const CANLI_KARE_ARALIGI = 6;     // canlı modda her kaçıncı karede kontrol yapılır (~10 Hz)
const CANLI_HATA_KARARLILIGI = 2; // canlı modda bir bölgenin kırmızıya dönmesi için art arda kaç kontrolde hatalı çıkmalı
// ----------------------------------------------------------------------

const bilgi = document.getElementById('bilgi');
const durum = document.getElementById('durum');
const sonucKutu = document.getElementById('sonuc');
const hataAyik = document.getElementById('hataAyik');
const arac = document.getElementById('arac');
const btnBasla = document.getElementById('basla');
const btnKontrol = document.getElementById('kontrol');
const btnCanli = document.getElementById('canli');
const btnOgret = document.getElementById('ogret');
const btnOgretSil = document.getElementById('ogretSil');
const btnAyar = document.getElementById('ayar');
const ayarPanel = document.getElementById('ayarPanel');
const ayarOkuma = document.getElementById('ayarOkuma');
const btnKilitle = document.getElementById('kilitle');
const btnDondur = document.getElementById('dondur');
const btnKaldir = document.getElementById('kaldir');
const btnCik = document.getElementById('cik');

const ISARET_GENISLIK = ISARET_GENISLIK_MM / 1000;
const PARCA_OFSET = (PARCA_OFSET_MM / 1000) * (ISARET_GENISLIK_MM / 100);

let kamera, sahne, renderer, kontrolcu, halka, isaretCerceve;
let model = null;
let bolgeIsaretleri = [];        // her bölge için sahnedeki küçük halka
let yerlesik = false;
let takipModu = 'isaret';
let isaretTakibiVar = false;
let sonIsaretDurumu = '';
let hitTestKaynagi = null;
let hitTestIstendi = false;
let isaretBitmap = null;
let oturum = null;

let ornekler = [];
let kilitli = false;
let capa = null;
let capaIsteniyor = false;
let sabitMatris = null;
let sapmaKare = 0;
let elenenOrnek = 0;
let beklemeKare = 0;
let sonIpucuZamani = 0;
let zeminY = [];                 // kilit sırasında yüzey halkasından okunan masa yükseklikleri
let kameraYolu = [];             // ölçüm sırasında kamera konumları (bakış açısı çeşitliliği için)

let kontrolIstendi = false;
let ogretIstendi = false;
// İnce ayar (kalibrasyon): işaret eksenlerinde mm cinsinden düzeltme; telefonda saklanır.
// Her kilitte aynı düzeltme gerekiyorsa hata sistematiktir ve buradan kalıcı olarak giderilir.
const AYAR_ANAHTAR = 'ayar2:' + MODEL_OBJ;   // anahtar değişti: eski elle ayar sıfırlanır, sistematik kısım artık kodda
let ayar = { x: 0, y: 0, z: 0 };
try { ayar = { x: 0, y: 0, z: 0, ...JSON.parse(localStorage.getItem(AYAR_ANAHTAR) || '{}') }; } catch (e) {}
let canli = false;
let kareSayaci = 0;
let hataSayaci = [];             // canlı modda bölge başına art arda hata sayısı
let ogretilen = {};              // { bölge adı: [ [r,g,b], ... ] } sağlam parçadan alınan referans renkler
const OGRET_ANAHTAR = 'ogret:' + MODEL_OBJ;
try { ogretilen = JSON.parse(localStorage.getItem(OGRET_ANAHTAR) || '{}'); } catch (e) { ogretilen = {}; }
let glBinding = null;
let yakalayici = null;           // kamera görüntüsünü küçük tampona çeken WebGL yardımcı nesneleri

const _poz = new THREE.Vector3(), _don = new THREE.Quaternion(), _olc = new THREE.Vector3(), _ofset = new THREE.Vector3();
const _mat = new THREE.Matrix4();

document.title = `Parça Kontrol – sürüm ${SURUM}`;
bilgi.textContent = `Model yükleniyor... (sürüm ${SURUM})`;
baslat();
modeliYukle();
isaretiHazirla();

function baslat() {
  sahne = new THREE.Scene();
  kamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  sahne.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
  const gunes = new THREE.DirectionalLight(0xffffff, 1.5);
  gunes.position.set(0.5, 1, 0.8);
  sahne.add(gunes);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  document.body.appendChild(renderer.domElement);

  arac.addEventListener('beforexrselect', (e) => e.preventDefault());

  kontrolcu = renderer.xr.getController(0);
  kontrolcu.addEventListener('select', elleYerlestir);
  sahne.add(kontrolcu);

  halka = new THREE.Mesh(
    new THREE.RingGeometry(0.03, 0.04, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x2ecc71 })
  );
  halka.matrixAutoUpdate = false;
  halka.visible = false;
  sahne.add(halka);

  const y = ISARET_GENISLIK / 2;
  isaretCerceve = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-y, 0, -y), new THREE.Vector3(y, 0, -y),
      new THREE.Vector3(y, 0, y), new THREE.Vector3(-y, 0, y)
    ]),
    new THREE.LineBasicMaterial({ color: 0x2ecc71 })
  );
  const altNokta = new THREE.Mesh(new THREE.SphereGeometry(0.005, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
  altNokta.position.set(0, 0, y);
  isaretCerceve.add(altNokta);
  isaretCerceve.matrixAutoUpdate = false;
  isaretCerceve.visible = false;
  sahne.add(isaretCerceve);

  btnBasla.addEventListener('click', arBaslat);
  btnCik.addEventListener('click', () => { if (oturum) oturum.end(); });
  btnKontrol.addEventListener('click', () => { kontrolIstendi = true; sonucKutu.textContent = 'Kontrol ediliyor...'; });
  btnCanli.addEventListener('click', () => {
    canli = !canli;
    btnCanli.classList.toggle('acik', canli);
    btnCanli.textContent = canli ? 'Canlı: açık' : 'Canlı';
    hataSayaci = [];
    if (!canli) sonucKutu.textContent = '';
  });
  btnOgret.addEventListener('click', () => { ogretIstendi = true; sonucKutu.textContent = 'Öğreniyor...'; });
  btnAyar.addEventListener('click', () => { ayarPanel.classList.toggle('acik'); ayarOkumaGuncelle(); });
  ayarPanel.addEventListener('beforexrselect', (e) => e.preventDefault());
  ayarPanel.querySelectorAll('button[data-eksen]').forEach((b) => {
    b.addEventListener('click', () => {
      ayar[b.dataset.eksen] += AYAR_ADIMI_MM * Number(b.dataset.yon);
      ayariKaydet();
    });
  });
  document.getElementById('ayarSifirla').addEventListener('click', () => { ayar = { x: 0, y: 0, z: 0 }; ayariKaydet(); });
  ayarOkumaGuncelle();
  btnOgretSil.addEventListener('click', () => {
    ogretilen = {};
    localStorage.removeItem(OGRET_ANAHTAR);
    ogretDurumu();
    sonucKutu.textContent = 'Öğretilen renkler silindi; kontrol CAD renkleriyle yapılır.';
  });
  ogretDurumu();
  btnKilitle.addEventListener('click', () => {
    takipModu = 'isaret';
    kilidiAc();
    btnKilitle.disabled = true;
    bilgi.textContent = 'Kamerayı işarete doğrult ve ölçüm bitene kadar sabit tut.';
  });
  btnDondur.addEventListener('click', () => { if (yerlesik) model.rotateY(THREE.MathUtils.degToRad(15)); });
  btnKaldir.addEventListener('click', () => {
    if (yerlesik) {
      sahne.remove(model);
      yerlesik = false;
      takipModu = 'elle';
      btnDondur.disabled = btnKaldir.disabled = btnKontrol.disabled = btnCanli.disabled = btnOgret.disabled = true;
      btnKilitle.disabled = false;
      bilgi.textContent = 'Model kaldırıldı. Halkaya dokun ya da İşarete kilitle.';
    }
  });

  window.addEventListener('resize', boyutDegisti);
  renderer.setAnimationLoop(ciz);
}

async function isaretiHazirla() {
  try {
    const img = new Image();
    img.src = ISARET_DOSYA;
    await img.decode();
    isaretBitmap = await createImageBitmap(img);
  } catch (e) {
    durum.textContent = 'İşaret görüntüsü yüklenemedi: ' + ISARET_DOSYA + ' depoda var mı?';
  }
}

async function arBaslat() {
  if (!navigator.xr) { bilgi.textContent = 'Bu tarayıcı WebXR desteklemiyor. Android Chrome kullan.'; return; }
  if (!(await navigator.xr.isSessionSupported('immersive-ar'))) { bilgi.textContent = 'Bu cihazda AR desteklenmiyor.'; return; }

  // camera-access: kamera görüntüsünü okuyup bölge kontrolü yapmak için (WebXR Incubations bayrağı gerekir)
  const temel = {
    requiredFeatures: ['hit-test', 'dom-overlay'],
    optionalFeatures: ['anchors', 'camera-access'],
    domOverlay: { root: document.body }
  };
  try {
    if (!isaretBitmap) throw new Error('işaret yok');
    oturum = await navigator.xr.requestSession('immersive-ar', {
      ...temel,
      requiredFeatures: [...temel.requiredFeatures, 'image-tracking'],
      trackedImages: [{ image: isaretBitmap, widthInMeters: ISARET_GENISLIK }]
    });
    isaretTakibiVar = true;
  } catch (e) {
    try {
      oturum = await navigator.xr.requestSession('immersive-ar', temel);
    } catch (e2) {
      bilgi.textContent = 'AR başlatılamadı: ' + e2.message;
      return;
    }
    isaretTakibiVar = false;
    takipModu = 'elle';
  }

  await renderer.xr.setSession(oturum);
  glBinding = null; yakalayici = null;
  btnBasla.classList.add('gizli');
  [btnKontrol, btnCanli, btnOgret, btnOgretSil, btnAyar, btnKilitle, btnDondur, btnKaldir, btnCik].forEach(b => b.classList.remove('gizli'));
  btnKilitle.disabled = true;
  btnKontrol.disabled = btnCanli.disabled = btnOgret.disabled = !yerlesik;

  if (isaretTakibiVar) {
    bilgi.textContent = 'Kamerayı basılı işarete doğrult.';
    durum.textContent = 'İşaret aranıyor...';
    if (oturum.getTrackedImageScores) {
      oturum.getTrackedImageScores().then((puanlar) => {
        if (puanlar[0] === 'untrackable') durum.textContent = 'İşaret görüntüsü takip için uygun bulunmadı.';
      });
    }
  } else {
    bilgi.textContent = 'İşaret takibi kapalı (Chrome bayrağı). Yeşil halka göründüğünde dokunarak yerleştir.';
    durum.textContent = 'Açmak için: chrome://flags → "WebXR Incubations" → Enabled → Chrome\'u yeniden başlat.';
  }

  oturum.addEventListener('end', () => {
    oturum = null;
    hitTestIstendi = false; hitTestKaynagi = null;
    if (yerlesik) { sahne.remove(model); yerlesik = false; }
    takipModu = 'isaret';
    kilidiAc();
    glBinding = null; yakalayici = null;
    isaretCerceve.visible = false; halka.visible = false;
    hataAyik.style.display = 'none';
    btnBasla.classList.remove('gizli');
    [btnKontrol, btnCanli, btnOgret, btnOgretSil, btnAyar, btnKilitle, btnDondur, btnKaldir, btnCik].forEach(b => b.classList.add('gizli'));
    ayarPanel.classList.remove('acik');
    canli = false; btnCanli.classList.remove('acik'); btnCanli.textContent = 'Canlı';
    bilgi.textContent = `AR kapatıldı. Tekrar başlatabilirsin. (sürüm ${SURUM})`;
    durum.textContent = ''; sonucKutu.textContent = '';
  });
}

function modeliYukle() {
  new MTLLoader().load(MODEL_MTL, (malzemeler) => {
    malzemeler.preload();
    const yukleyici = new OBJLoader();
    yukleyici.setMaterials(malzemeler);
    yukleyici.load(MODEL_OBJ, (obj) => {
      obj.scale.setScalar(MODEL_OLCEK);
      obj.traverse((o) => {
        if (!o.isMesh) return;
        (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.transparent = true; m.opacity = MODEL_SEFFAFLIK; });
      });
      const kutu = new THREE.Box3().setFromObject(obj);
      const merkez = kutu.getCenter(new THREE.Vector3());
      obj.position.set(-merkez.x, -kutu.min.y, -merkez.z);   // taban yerde, orta noktada
      model = new THREE.Group();
      model.add(obj);
      bolgeIsaretleriniKur();
      const boyut = kutu.getSize(new THREE.Vector3()).multiplyScalar(1000);
      bilgi.textContent = `Model hazır (${boyut.x.toFixed(0)} × ${boyut.y.toFixed(0)} × ${boyut.z.toFixed(0)} mm), ${BOLGELER.length} kontrol bölgesi. AR'ı başlat. (sürüm ${SURUM})`;
    },
    (ilerleme) => { if (ilerleme.total) bilgi.textContent = `Model yükleniyor %${Math.round(100 * ilerleme.loaded / ilerleme.total)}`; },
    () => { bilgi.textContent = 'Model yüklenemedi: ' + MODEL_OBJ + ' depoda var mı?'; });
  }, undefined, () => { bilgi.textContent = 'Renk dosyası yüklenemedi: ' + MODEL_MTL + ' depoda var mı?'; });
}

// Her kontrol bölgesine, yüzeyin 1 mm üstünde küçük bir halka koy (gri: kontrol edilmedi)
function bolgeIsaretleriniKur() {
  const r = BOLGE_YARICAP_MM / 1000;
  const geo = new THREE.RingGeometry(r * 0.8, r * 1.1, 24);
  bolgeIsaretleri = BOLGELER.map((b) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x9e9e9e, side: THREE.DoubleSide, depthTest: false, transparent: true, opacity: 0.9 }));
    const n = new THREE.Vector3(...b.normal);
    m.position.set(b.konum[0] / 1000, b.konum[1] / 1000, b.konum[2] / 1000).addScaledVector(n, 0.001);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), n);   // halka düzlemi yüzeye paralel
    m.renderOrder = 10;
    model.add(m);
    return m;
  });
}

function modeliGoster() {
  if (!yerlesik) {
    sahne.add(model);
    yerlesik = true;
    btnDondur.disabled = btnKaldir.disabled = btnKontrol.disabled = btnCanli.disabled = btnOgret.disabled = false;
  }
}

function ayariKaydet() {
  try { localStorage.setItem(AYAR_ANAHTAR, JSON.stringify(ayar)); } catch (e) {}
  ayarOkumaGuncelle();
  if (yerlesik && kilitli && takipModu === 'isaret') {
    if (capa === null && sabitMatris) modeliIsaretPozunaKoy(sabitMatris);   // çapa varsa bir sonraki karede zaten uygulanır
  }
}
function ayarOkumaGuncelle() {
  ayarOkuma.textContent = `Düzeltme — sağ/sol: ${ayar.x > 0 ? '+' : ''}${ayar.x} mm, yükseklik: ${ayar.y > 0 ? '+' : ''}${ayar.y} mm, işaret yönü: ${ayar.z > 0 ? '+' : ''}${ayar.z} mm`;
  btnAyar.textContent = (ayar.x || ayar.y || ayar.z) ? 'Ayar ●' : 'Ayar';
}

function modeliIsaretPozunaKoy(matris) {
  matris.decompose(_poz, _don, _olc);
  // sayfada aşağı = +Z; ince ayar düzeltmesi de işaret eksenlerinde eklenir
  _ofset.set((SISTEMATIK_DUZELTME.x + ayar.x) / 1000, (SISTEMATIK_DUZELTME.y + ayar.y) / 1000, PARCA_OFSET + (SISTEMATIK_DUZELTME.z + ayar.z) / 1000).applyQuaternion(_don);
  model.position.copy(_poz).add(_ofset);
  model.quaternion.copy(_don);
  model.scale.set(1, 1, 1);
  modeliGoster();
}

function isaretGoruldu(poz, frame, referansAlani) {
  const t = poz.transform;
  if (!kilitli) {
    if (capaIsteniyor) return;
    // Düz bir kağıdın pozu, özellikle yatık açıdan bakınca iki farklı çözüme oturabilir (düzlem belirsizliği).
    // İşaret masada yatay durduğu için normali yukarı bakmayan ölçümleri baştan eliyoruz.
    if (ISARET_YATAY) {
      _don.set(t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w);
      const normalDunya = _poz.set(0, 1, 0).applyQuaternion(_don);
      const egim = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(normalDunya.y, -1, 1)));
      if (egim > MAKS_EGIM_DERECE) {
        elenenOrnek++;
        if (elenenOrnek % 15 === 0) durum.textContent = 'İşaret ölçümü güvenilir değil — telefonu işaretin üstüne getir, daha dik bak';
        return;
      }
    }
    // Görüş kalitesi: uzaklık, bakış açısı ve görüntüde merkeze yakınlık
    const ipucu = gorusKalitesi(t, frame, referansAlani);
    beklemeKare++;
    if (ipucu) {
      if (performance.now() - sonIpucuZamani > 400) { durum.textContent = ipucu; sonIpucuZamani = performance.now(); }
      return;
    }
    ornekler.push({ p: [t.position.x, t.position.y, t.position.z], q: [t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w] });
    if (ornekler.length > ORNEK_SAYISI) ornekler.shift();   // kayan pencere: en yeni iyi ölçümler
    const gorus = frame.getViewerPose(referansAlani);
    if (gorus) { const k = gorus.transform.position; kameraYolu.push([k.x, k.y, k.z]); if (kameraYolu.length > ORNEK_SAYISI) kameraYolu.shift(); }
    // Masa yüksekliği: yüzey halkası masaya değiyorsa (işaretle aynı seviyede) onun Y'sini de topla
    if (halka.visible) {
      const hy = halka.matrix.elements[13];
      if (Math.abs(hy - t.position.y) < 0.02) { zeminY.push(hy); if (zeminY.length > ORNEK_SAYISI) zeminY.shift(); }
    }
    const yol = kameraYayilimi();
    durum.textContent = `İşaret ölçülüyor ${ornekler.length}/${ORNEK_SAYISI} — telefonu yavaşça hafif gezdir (${(yol * 100).toFixed(0)}/${(MIN_KAMERA_YOLU_M * 100).toFixed(0)} cm)`;
    if (ornekler.length >= ORNEK_SAYISI) {
      const poz = ortalamaPoz(ornekler);
      const tutarli = poz.kullanilan >= TUTARLILIK_ORAN * ORNEK_SAYISI && poz.yayilimMM <= TUTARLILIK_MM && yol >= MIN_KAMERA_YOLU_M;
      if (tutarli || beklemeKare > MAKS_BEKLEME_KARE) {
        kilitle(poz, frame, referansAlani);
        if (!tutarli) durum.textContent = `Kilitlendi ama ölçümler dağınıktı (±${poz.yayilimMM.toFixed(0)} mm). Gerekirse İşarete kilitle ile yenile.`;
      } else if (performance.now() - sonIpucuZamani > 400) {
        durum.textContent = yol < MIN_KAMERA_YOLU_M
          ? `Telefonu yavaşça biraz daha gezdir (${(yol * 100).toFixed(0)}/${(MIN_KAMERA_YOLU_M * 100).toFixed(0)} cm)`
          : `Ölçümler tutarsız (±${poz.yayilimMM.toFixed(0)} mm) — daha yavaş hareket et`;
        sonIpucuZamani = performance.now();
      }
    }
    return;
  }
  // Kilitliyken sapma denetimi yalnızca iyi görüş koşullarında yapılır; yatık/uzak bakışta işaret ölçümü zaten sapar.
  if (gorusKalitesi(t, frame, referansAlani)) { sapmaKare = 0; return; }
  const kilitliPoz = capa ? frame.getPose(capa.anchorSpace, referansAlani) : null;
  const kp = kilitliPoz ? kilitliPoz.transform.position : (sabitMatris ? { x: sabitMatris.elements[12], y: sabitMatris.elements[13], z: sabitMatris.elements[14] } : null);
  if (kp) {
    const d = Math.hypot(t.position.x - kp.x, t.position.y - kp.y, t.position.z - kp.z);
    sapmaKare = d > YENIDEN_KILIT_M ? sapmaKare + 1 : 0;
    if (sapmaKare >= YENIDEN_KILIT_KARE) {
      kilidiAc();
      bilgi.textContent = 'Hizalama kaymış görünüyor, yeniden ölçülüyor. Telefonu sabit tut.';
    }
  }
}

// Ölçüm sırasında kameranın kat ettiği yayılım (en uzak iki konum arası, kabaca)
function kameraYayilimi() {
  if (kameraYolu.length < 2) return 0;
  let mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  for (const k of kameraYolu) for (let i = 0; i < 3; i++) { if (k[i] < mn[i]) mn[i] = k[i]; if (k[i] > mx[i]) mx[i] = k[i]; }
  return Math.hypot(mx[0] - mn[0], mx[1] - mn[1], mx[2] - mn[2]);
}

// İşaretin o karede yeterince iyi görüldüğünü denetler; sorun varsa kullanıcıya ipucu döndürür, yoksa ''.
function gorusKalitesi(t, frame, referansAlani) {
  const gorus = frame.getViewerPose(referansAlani);
  if (!gorus) return 'Kamera pozu yok';
  const view = gorus.views[0];
  const kam = view.transform.position;
  const dx = kam.x - t.position.x, dy = kam.y - t.position.y, dz = kam.z - t.position.z;
  const mesafe = Math.hypot(dx, dy, dz);
  if (mesafe > MAKS_MESAFE_M) return `İşarete yaklaş (${(mesafe * 100).toFixed(0)} cm, en fazla ${(MAKS_MESAFE_M * 100).toFixed(0)} cm)`;
  _don.set(t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w);
  const normal = _poz.set(0, 1, 0).applyQuaternion(_don);
  const cosAci = (normal.x * dx + normal.y * dy + normal.z * dz) / mesafe;
  const aci = THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(cosAci, -1, 1)));
  if (aci > MAKS_BAKIS_ACISI) return `İşarete daha dik bak (${aci.toFixed(0)}°, en fazla ${MAKS_BAKIS_ACISI}°)`;
  _mat.fromArray(view.projectionMatrix).multiply(new THREE.Matrix4().fromArray(view.transform.inverse.matrix));
  const ndc = _ofset.set(t.position.x, t.position.y, t.position.z).applyMatrix4(_mat);
  if (Math.abs(ndc.x) > MERKEZ_SINIRI || Math.abs(ndc.y) > MERKEZ_SINIRI) return 'İşareti ekranın ortasına al';
  return '';
}

// Dayanıklı ortalama: önce diğerlerine en çok benzeyen yönelimi (medoid) bul, ona 4°'den yakın
// ölçümleri al, yalnızca onların ortalamasını/ortancasını kullan. Böylece tek tük bozuk ölçüm sonucu çevirmez.
function ortalamaPoz(ornekler) {
  const mutlakNokta = (a, b) => Math.abs(a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3]);
  let medoid = ornekler[0], enIyi = -1;
  for (const a of ornekler) {
    let toplam = 0;
    for (const b of ornekler) toplam += mutlakNokta(a.q, b.q);
    if (toplam > enIyi) { enIyi = toplam; medoid = a; }
  }
  const esik = Math.cos(THREE.MathUtils.degToRad(4) / 2);            // quaternion iç çarpımı ↔ açı
  let icerde = ornekler.filter(o => mutlakNokta(o.q, medoid.q) >= esik);
  if (icerde.length < 5) icerde = [medoid];
  const ortanca = (dizi) => { const s = [...dizi].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  const p = [0, 1, 2].map(i => ortanca(icerde.map(o => o.p[i])));
  const q = [0, 0, 0, 0];
  for (const o of icerde) {
    const isaret = (o.q[0]*medoid.q[0] + o.q[1]*medoid.q[1] + o.q[2]*medoid.q[2] + o.q[3]*medoid.q[3]) < 0 ? -1 : 1;
    for (let i = 0; i < 4; i++) q[i] += isaret * o.q[i];
  }
  const n = Math.hypot(...q);
  const yayilimMM = Math.max(...icerde.map(o => Math.hypot(o.p[0] - p[0], o.p[1] - p[1], o.p[2] - p[2]))) * 1000;
  return { position: { x: p[0], y: p[1], z: p[2], w: 1 }, orientation: { x: q[0]/n, y: q[1]/n, z: q[2]/n, w: q[3]/n }, kullanilan: icerde.length, yayilimMM };
}

// İşaret masada yatay durduğu biliniyorsa ölçümün en zayıf bileşeni olan eğimi tamamen atarız:
// yalnızca dikey eksen etrafındaki dönüş (kağıdın masadaki açısı) ölçümden alınır, normal tam yukarı zorlanır.
// Yükseklik için de ARCore'un algıladığı masa düzlemi (yüzey halkası) kullanılır; o daha kararlıdır.
function yatayaOtur(poz) {
  const q = new THREE.Quaternion(poz.orientation.x, poz.orientation.y, poz.orientation.z, poz.orientation.w);
  const z = new THREE.Vector3(0, 0, 1).applyQuaternion(q);   // sayfada "aşağı" yönü
  z.y = 0;
  if (z.lengthSq() < 1e-6) return poz;
  z.normalize();
  const y = new THREE.Vector3(0, 1, 0);
  const x = new THREE.Vector3().crossVectors(y, z).normalize();
  const q2 = new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  let yukseklik = poz.position.y;
  if (ZEMIN_YUKSEKLIGINI_KULLAN && zeminY.length >= 5) {
    const sirali = [...zeminY].sort((a, b) => a - b);
    yukseklik = sirali[Math.floor(sirali.length / 2)];
  }
  return { ...poz, orientation: { x: q2.x, y: q2.y, z: q2.z, w: q2.w }, position: { ...poz.position, y: yukseklik, w: 1 } };
}

function kilitle(poz, frame, referansAlani) {
  if (ISARET_YATAY) poz = yatayaOtur(poz);
  const sabitle = () => {
    sabitMatris = new THREE.Matrix4().compose(
      new THREE.Vector3(poz.position.x, poz.position.y, poz.position.z),
      new THREE.Quaternion(poz.orientation.x, poz.orientation.y, poz.orientation.z, poz.orientation.w),
      new THREE.Vector3(1, 1, 1));
    kilitli = true; capaIsteniyor = false;
    durum.textContent = 'İşarete kilitlendi (sabit poz)';
  };
  if (typeof frame.createAnchor === 'function') {
    capaIsteniyor = true;
    frame.createAnchor(new XRRigidTransform(poz.position, poz.orientation), referansAlani)
      .then((a) => { capa = a; kilitli = true; capaIsteniyor = false; durum.textContent = `İşarete kilitlendi (çapa, ${poz.kullanilan || ORNEK_SAYISI} tutarlı ölçüm).`; })
      .catch(sabitle);
  } else {
    sabitle();
  }
  bilgi.textContent = 'Model yerleşti. Küpü kutuya koy, kameradan iyi görünürken "Kontrol et"e bas.';
}

function kilidiAc() {
  if (capa && typeof capa.delete === 'function') { try { capa.delete(); } catch (e) {} }
  capa = null; sabitMatris = null; kilitli = false; capaIsteniyor = false;
  ornekler = []; sapmaKare = 0; elenenOrnek = 0; beklemeKare = 0; zeminY = []; kameraYolu = [];
}

function elleYerlestir() {
  if (!model || !halka.visible) return;
  halka.matrix.decompose(model.position, model.quaternion, model.scale);
  takipModu = 'elle';
  btnKilitle.disabled = !isaretTakibiVar;
  modeliGoster();
  bilgi.textContent = 'Elle yerleştirildi. Döndür ile hizala; işarete geri dönmek için İşarete kilitle.';
}

// ---- Kamera görüntüsünden bölge kontrolü -----------------------------
// Kamera görüntüsü (WebXR camera-access) bir WebGL dokusu olarak gelir. Onu 320 px genişlikte küçük
// bir tampona çizip piksellerini okuyoruz; sonra her bölgenin 3B merkezini görüntü düzlemine
// projekte edip çevresindeki piksellerin ortalama rengine bakıyoruz.
function yakalayiciKur(gl, W, H) {
  const derle = (tip, kaynak) => { const s = gl.createShader(tip); gl.shaderSource(s, kaynak); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, derle(gl.VERTEX_SHADER, 'attribute vec2 a; varying vec2 v; void main(){ v = a*0.5+0.5; gl_Position = vec4(a,0.,1.); }'));
  gl.attachShader(prog, derle(gl.FRAGMENT_SHADER, 'precision mediump float; uniform sampler2D t; varying vec2 v; void main(){ gl_FragColor = texture2D(t, v); }'));
  gl.linkProgram(prog);
  const aLoc = gl.getAttribLocation(prog, 'a');
  const tLoc = gl.getUniformLocation(prog, 't');
  const vao = gl.createVertexArray ? gl.createVertexArray() : null;
  if (vao) gl.bindVertexArray(vao);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(aLoc);
  gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
  if (vao) gl.bindVertexArray(null);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { prog, aLoc, tLoc, vao, buf, fbo, W, H, piksel: new Uint8Array(W * H * 4) };
}

function kareYakala(gl, kameraDokusu) {
  const y = yakalayici;
  gl.bindFramebuffer(gl.FRAMEBUFFER, y.fbo);
  gl.viewport(0, 0, y.W, y.H);
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.disable(gl.SCISSOR_TEST); gl.disable(gl.CULL_FACE);
  gl.useProgram(y.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, kameraDokusu);
  gl.uniform1i(y.tLoc, 0);
  if (y.vao) gl.bindVertexArray(y.vao);
  else { gl.bindBuffer(gl.ARRAY_BUFFER, y.buf); gl.enableVertexAttribArray(y.aLoc); gl.vertexAttribPointer(y.aLoc, 2, gl.FLOAT, false, 0, 0); }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.readPixels(0, 0, y.W, y.H, gl.RGBA, gl.UNSIGNED_BYTE, y.piksel);   // satırlar alttan üste
  if (y.vao) gl.bindVertexArray(null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  renderer.resetState();   // Three.js'in durum önbelleğini sıfırla; bir sonraki karede kendi ayarlarını yeniden uygular
}

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d > 0) {
    if (max === r) h = 60 * (((g - b) / d) % 6);
    else if (max === g) h = 60 * ((b - r) / d + 2);
    else h = 60 * ((r - g) / d + 4);
    if (h < 0) h += 360;
  }
  return { h, s: max === 0 ? 0 : d / max, v: max };
}

function renkKarari(hsv, beklenen) {
  const k = RENKLER[beklenen];
  if (!k) return { tamam: false, neden: 'tanımsız renk' };
  if (k.notr) {
    if (hsv.v < k.minV) return { tamam: false, neden: 'karanlık/boş' };
    if (hsv.s > k.maxS) return { tamam: false, neden: 'renkli' };
    return { tamam: true };
  }
  if (hsv.v < MIN_PARLAKLIK) return { tamam: false, neden: 'karanlık/boş' };
  if (hsv.s < MIN_DOYGUNLUK) return { tamam: false, neden: 'renksiz' };
  let fark = Math.abs(hsv.h - k.ton) % 360;
  if (fark > 180) fark = 360 - fark;
  return fark <= k.tol ? { tamam: true } : { tamam: false, neden: `farklı renk (ton ${hsv.h.toFixed(0)}°)` };
}

// Kamera karesini yakalar ve her bölgenin görünürlüğünü + ortalama rengini ölçer.
// Karar vermez; kontrol ve öğret bunu kullanır. Hata varsa {hata: mesaj} döner.
function bolgeleriOlc(frame, referansAlani) {
  const gorus = frame.getViewerPose(referansAlani);
  if (!gorus) return { hata: 'Kamera pozu alınamadı, tekrar dene.' };
  const view = gorus.views[0];
  if (!view.camera) return { hata: '<span class="eksik">Kamera görüntüsüne erişim yok.</span> chrome://flags → "WebXR Incubations" Enabled mı? Chrome\'u yeniden başlatıp dene.' };
  const gl = renderer.getContext();
  if (!glBinding) glBinding = new XRWebGLBinding(oturum, gl);
  const doku = glBinding.getCameraImage(view.camera);
  if (!doku) return { hata: 'Bu karede kamera görüntüsü yok, tekrar dene.' };
  if (!yakalayici) yakalayici = yakalayiciKur(gl, 320, Math.max(4, Math.round(320 * view.camera.height / view.camera.width)));
  kareYakala(gl, doku);
  const { W, H, piksel } = yakalayici;

  const PV = new THREE.Matrix4().fromArray(view.projectionMatrix).multiply(new THREE.Matrix4().fromArray(view.transform.inverse.matrix));
  const kameraKonum = new THREE.Vector3(view.transform.position.x, view.transform.position.y, view.transform.position.z);
  model.updateMatrixWorld(true);

  const dunya = new THREE.Vector3(), normalD = new THREE.Vector3(), bakis = new THREE.Vector3(), teget = new THREE.Vector3(), kenar = new THREE.Vector3(), ndc = new THREE.Vector3();
  const olcumler = BOLGELER.map((b) => {
    dunya.set(b.konum[0] / 1000, b.konum[1] / 1000, b.konum[2] / 1000);
    model.localToWorld(dunya);
    normalD.set(...b.normal).applyQuaternion(model.quaternion);
    bakis.copy(kameraKonum).sub(dunya).normalize();
    if (normalD.dot(bakis) < 0.30) return { gorunur: false };
    ndc.copy(dunya).applyMatrix4(PV);
    if (Math.abs(ndc.x) > 0.98 || Math.abs(ndc.y) > 0.98 || ndc.z > 1) return { gorunur: false };
    const px = (ndc.x + 1) / 2 * W, py = (ndc.y + 1) / 2 * H;
    teget.crossVectors(normalD, Math.abs(normalD.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0)).normalize();
    kenar.copy(dunya).addScaledVector(teget, BOLGE_YARICAP_MM / 1000).applyMatrix4(PV);
    const r = Math.min(14, Math.max(2, Math.hypot((kenar.x - ndc.x) / 2 * W, (kenar.y - ndc.y) / 2 * H)));
    // Kanal başına ORTANCA: daire kısmen komşu yüze/boşluğa taşsa bile (pikselerin yarısından azı) sonuç bozulmaz
    const Rs = [], Gs = [], Bs = [];
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = Math.round(px + dx), yy = Math.round(py + dy);
      if (x < 0 || x >= W || yy < 0 || yy >= H) continue;
      const k = (yy * W + x) * 4;
      Rs.push(piksel[k]); Gs.push(piksel[k + 1]); Bs.push(piksel[k + 2]);
    }
    if (!Rs.length) return { gorunur: false };
    const ort = (d) => { d.sort((a, b) => a - b); return d[d.length >> 1]; };
    return { gorunur: true, px, py, r, rgb: [ort(Rs), ort(Gs), ort(Bs)] };
  });
  return { olcumler, W, H, piksel };
}

// Öğretilmiş referansla karşılaştırma: renk oranları (ışık şiddetinden bağımsız) + parlaklık oranı
const kroma = (c) => { const t = c[0] + c[1] + c[2] + 1e-6; return [c[0] / t, c[1] / t, (c[0] + c[1] + c[2]) / 3]; };

// Bir ölçümün, öğretilmiş referanslardan en yakınına göre parlaklık oranı (ışık değişimini ölçmek için)
function parlaklikOrani(rgb, referanslar) {
  const [r1, g1, v1] = kroma(rgb);
  let enIyi = Infinity, oran = 1;
  for (const ref of referanslar) {
    const [r2, g2, v2] = kroma(ref);
    const d = Math.hypot(r1 - r2, g1 - g2);
    if (d < enIyi) { enIyi = d; oran = v1 / (v2 + 1e-6); }
  }
  return { kromaFarki: enIyi, oran };
}

// genelOran: o karede tüm bölgelerin ortak ışık değişimi (gölge, pozlama). Tek bir bölge bundan sapıyorsa hata.
function ogretilenKarar(rgb, referanslar, genelOran = 1) {
  const { kromaFarki, oran } = parlaklikOrani(rgb, referanslar);
  const goreli = oran / genelOran;
  if (goreli < PARLAKLIK_ORAN_MIN) return { tamam: false, neden: 'karanlık/boş' };
  if (goreli > PARLAKLIK_ORAN_MAKS) return { tamam: false, neden: 'çok parlak/yansıma' };
  if (kromaFarki > KROMA_ESIGI) return { tamam: false, neden: 'farklı renk' };
  return { tamam: true };
}

function bolgeKarari(b, rgb, genelOran) {
  const ref = ogretilen[b.ad];
  if (ref && ref.length) return ogretilenKarar(rgb, ref, genelOran);
  return renkKarari(rgbToHsv(rgb[0], rgb[1], rgb[2]), b.renk);   // öğretilmemişse CAD rengi kuralı
}

// Karedeki genel ışık değişimi: öğretilmiş ve görünen bölgelerin parlaklık oranlarının ortancası.
// Eksik/kapalı bir bölge azınlıkta kaldığı sürece ortancayı etkilemez.
function genelIsikOrani(olcumler) {
  const oranlar = [];
  olcumler.forEach((o, i) => {
    const ref = ogretilen[BOLGELER[i].ad];
    if (o.gorunur && ref && ref.length) oranlar.push(parlaklikOrani(o.rgb, ref).oran);
  });
  if (oranlar.length < 3) return 1;
  oranlar.sort((a, b) => a - b);
  return oranlar[Math.floor(oranlar.length / 2)];
}

function kontrolYap(frame, referansAlani, canliMod) {
  const sonuc = bolgeleriOlc(frame, referansAlani);
  if (sonuc.hata) { sonucKutu.innerHTML = sonuc.hata; return; }
  const { olcumler, W, H, piksel } = sonuc;
  const noktalar = [];
  const genelOran = genelIsikOrani(olcumler);
  let tamamSay = 0, eksikler = [], gorunmez = 0;
  olcumler.forEach((o, i) => {
    const isaret = bolgeIsaretleri[i];
    if (!o.gorunur) { gorunmez++; isaret.material.color.set(0x9e9e9e); hataSayaci[i] = 0; return; }
    const karar = bolgeKarari(BOLGELER[i], o.rgb, genelOran);
    let hatali = !karar.tamam;
    if (canliMod) {   // canlıda tek karelik titremeleri ele: art arda hata gerekir
      hataSayaci[i] = hatali ? (hataSayaci[i] || 0) + 1 : 0;
      hatali = hataSayaci[i] >= CANLI_HATA_KARARLILIGI;
    }
    if (!hatali) { tamamSay++; isaret.material.color.set(0x2ecc71); }
    else { eksikler.push(`${BOLGELER[i].ad}: ${karar.neden}`); isaret.material.color.set(0xff3b30); }
    noktalar.push({ px: o.px, py: o.py, r: o.r, tamam: !hatali });
  });
  const kontrolEdilen = BOLGELER.length - gorunmez;
  let html = `<span class="${eksikler.length ? 'eksik' : 'tamam'}">${tamamSay}/${kontrolEdilen} bölge tamam</span>`;
  if (gorunmez) html += ` · ${gorunmez} görüş dışında`;
  if (Object.keys(ogretilen).length) html += ` · öğretilmiş referans, ışık ×${genelOran.toFixed(2)}`;
  if (eksikler.length) html += '<br>' + eksikler.map(e => `<span class="eksik">✗ ${e}</span>`).join('<br>');
  sonucKutu.innerHTML = html;
  if (!canliMod || kareSayaci % 30 === 0) hataAyiklamaCiz(W, H, piksel, noktalar);
}

// Sağlam parçadan referans al: görünen her bölgenin o anki rengi listeye eklenir.
// Farklı açılardan birkaç kez basmak referansı zenginleştirir.
function ogret(frame, referansAlani) {
  const sonuc = bolgeleriOlc(frame, referansAlani);
  if (sonuc.hata) { sonucKutu.innerHTML = sonuc.hata; return; }
  let eklenen = 0;
  sonuc.olcumler.forEach((o, i) => {
    if (!o.gorunur) return;
    const ad = BOLGELER[i].ad;
    (ogretilen[ad] = ogretilen[ad] || []).push(o.rgb.map(Math.round));
    if (ogretilen[ad].length > 12) ogretilen[ad].shift();
    bolgeIsaretleri[i].material.color.set(0x9ad0ff);
    eklenen++;
  });
  try { localStorage.setItem(OGRET_ANAHTAR, JSON.stringify(ogretilen)); } catch (e) {}
  ogretDurumu();
  sonucKutu.innerHTML = `${eklenen} bölgenin rengi öğrenildi. Küpü farklı bir açıdan görüp tekrar basabilirsin.`;
  hataAyiklamaCiz(sonuc.W, sonuc.H, sonuc.piksel, sonuc.olcumler.filter(o => o.gorunur).map(o => ({ ...o, tamam: true })));
}

function ogretDurumu() {
  const n = Object.keys(ogretilen).length;
  btnOgret.textContent = n ? `Öğret (${n}/${BOLGELER.length})` : 'Öğret';
  btnOgretSil.style.display = n ? '' : 'none';
}

// Sağ altta: yakalanan kamera karesi ve örneklenen noktalar (projeksiyon doğru mu diye)
function hataAyiklamaCiz(W, H, piksel, noktalar) {
  hataAyik.style.display = 'block';
  const ara = document.createElement('canvas'); ara.width = W; ara.height = H;
  const ctx = ara.getContext('2d');
  const img = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    img.data.set(piksel.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
  }
  ctx.putImageData(img, 0, 0);
  for (const n of noktalar) {
    ctx.beginPath(); ctx.arc(n.px, H - 1 - n.py, Math.max(2, n.r), 0, Math.PI * 2);
    ctx.lineWidth = 1.5; ctx.strokeStyle = n.tamam ? '#2ecc71' : '#ff3b30'; ctx.stroke();
  }
  hataAyik.width = W; hataAyik.height = H;
  hataAyik.getContext('2d').drawImage(ara, 0, 0);
}
// ----------------------------------------------------------------------

function boyutDegisti() {
  kamera.aspect = window.innerWidth / window.innerHeight;
  kamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function ciz(zaman, frame) {
  if (frame && oturum) {
    const referansAlani = renderer.xr.getReferenceSpace();

    if (!hitTestIstendi) {
      oturum.requestReferenceSpace('viewer').then((bakisAlani) => {
        oturum.requestHitTestSource({ space: bakisAlani }).then((kaynak) => { hitTestKaynagi = kaynak; });
      });
      hitTestIstendi = true;
    }
    if (hitTestKaynagi) {
      const sonuclar = frame.getHitTestResults(hitTestKaynagi);
      if (sonuclar.length) {
        halka.visible = true;
        halka.matrix.fromArray(sonuclar[0].getPose(referansAlani).transform.matrix);
      } else {
        halka.visible = false;
      }
    }

    if (isaretTakibiVar && typeof frame.getImageTrackingResults === 'function') {
      let durumMetni = 'İşaret görünmüyor';
      for (const sonuc of frame.getImageTrackingResults()) {
        if (sonuc.index !== 0) continue;
        const poz = frame.getPose(sonuc.imageSpace, referansAlani);
        if (!poz) continue;
        if (sonuc.trackingState === 'tracked') {
          isaretCerceve.matrix.fromArray(poz.transform.matrix);
          isaretCerceve.visible = true;
          if (model && takipModu === 'isaret') isaretGoruldu(poz, frame, referansAlani);
          durumMetni = kilitli ? `İşaret görüldü (ölçülen genişlik ${(sonuc.measuredWidthInMeters * 1000).toFixed(0)} mm)` : '';
        } else {
          durumMetni = kilitli ? 'İşaret görüş dışında, çapa takipte' : 'İşaret görünmüyor';
        }
      }
      if (durumMetni && durumMetni !== sonIsaretDurumu) {
        sonIsaretDurumu = durumMetni;
        durum.textContent = durumMetni;
      }

      if (kilitli && model && takipModu === 'isaret') {
        if (capa) {
          const cp = frame.getPose(capa.anchorSpace, referansAlani);
          if (cp) { _mat.fromArray(cp.transform.matrix); modeliIsaretPozunaKoy(_mat); }
        } else if (sabitMatris) {
          modeliIsaretPozunaKoy(sabitMatris);
        }
      }
    }

    renderer.render(sahne, kamera);

    // Kontrol, çizimden SONRA yapılır: kamera dokusu bu kare boyunca geçerli, sonrasında resetState ile
    // Three.js durumu sıfırlanır ve bir sonraki karede yeniden kurulur.
    kareSayaci++;
    if (yerlesik) {
      try {
        if (ogretIstendi) { ogretIstendi = false; ogret(frame, referansAlani); }
        else if (kontrolIstendi) { kontrolIstendi = false; kontrolYap(frame, referansAlani, false); }
        else if (canli && kilitli && kareSayaci % CANLI_KARE_ARALIGI === 0) kontrolYap(frame, referansAlani, true);
      } catch (e) { sonucKutu.textContent = 'Kontrol hatası: ' + e.message; renderer.resetState(); }
    } else { kontrolIstendi = ogretIstendi = false; }
    return;
  }
  renderer.render(sahne, kamera);
}
</script>
