<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parça Kontrol – İşaretle Hizalama</title>
<style>
  body { margin: 0; background: #1c1f24; color: #e8e8e8; font-family: system-ui, sans-serif; }
  #bilgi {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 16px; font-size: 15px; line-height: 1.4; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #durum {
    position: absolute; top: 96px; left: 0; right: 0; text-align: center;
    font-size: 13px; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #arac {
    position: absolute; bottom: 24px; left: 0; right: 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 0 12px;
  }
  #arac button {
    padding: 12px 18px; font-size: 15px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,.9); color: #1c1f24;
  }
  #arac button:disabled { opacity: .4; }
  #basla { background: #2ecc71; font-weight: 600; }
  .gizli { display: none !important; }
</style>
</head>
<body>
<div id="bilgi">Model yükleniyor...</div>
<div id="durum"></div>
<div id="arac">
  <button id="basla">AR'ı başlat</button>
  <button id="kilitle" class="gizli" disabled>İşarete kilitle</button>
  <button id="dondur" class="gizli" disabled>Döndür 15°</button>
  <button id="kaldir" class="gizli" disabled>Kaldır</button>
  <button id="cik" class="gizli">Çık</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

// ---- Ayarlar ---------------------------------------------------------
const MODEL_OBJ = 'parca.obj';
const MODEL_MTL = 'parca.mtl';
const MODEL_OLCEK = 0.001;        // model mm ise 0.001 (Three.js metre kullanır)

const ISARET_DOSYA = 'isaret.png';
const ISARET_GENISLIK_MM = 100;   // kağıttaki işaretin cetvelle ölçülen dış genişliği
const PARCA_OFSET_MM = 100;       // işaret merkezinden parça yerinin merkezine, sayfada aşağı doğru (%100 baskıda)
// ----------------------------------------------------------------------

const bilgi = document.getElementById('bilgi');
const durum = document.getElementById('durum');
const arac = document.getElementById('arac');
const btnBasla = document.getElementById('basla');
const btnKilitle = document.getElementById('kilitle');
const btnDondur = document.getElementById('dondur');
const btnKaldir = document.getElementById('kaldir');
const btnCik = document.getElementById('cik');

const ISARET_GENISLIK = ISARET_GENISLIK_MM / 1000;
const PARCA_OFSET = (PARCA_OFSET_MM / 1000) * (ISARET_GENISLIK_MM / 100); // baskı ölçeği farklıysa ofset de aynı oranda değişir
// İşaret uzayı (Chrome/ARCore): düzlem XZ, +Y kağıttan dışa (normal), +X sağa, +Z sayfada aşağı doğru.
// Modelin +Y'si zaten normalle aynı, ek dönüş gerekmez.
const ORNEK_SAYISI = 40;         // kilitlemeden önce işaret pozunun kaç kare ortalaması alınacak (~0,7 s)
const YENIDEN_KILIT_M = 0.03;    // işaret, kilitli konumdan bu kadar (30 mm) uzakta görülürse kağıt oynamış say, yeniden kilitle
const YENIDEN_KILIT_KARE = 45;   // ... ve bu sapma en az bu kadar kare art arda sürmeli

let kamera, sahne, renderer, kontrolcu, halka, isaretCerceve;
let model = null;
let yerlesik = false;
let takipModu = 'isaret';        // 'isaret': işareti izle, 'elle': dokunarak yerleştirildi
let isaretTakibiVar = false;
let sonIsaretDurumu = '';
let ornekler = [];               // kilitleme öncesi toplanan işaret pozları
let kilitli = false;             // işaret pozu kilitlendi mi
let capa = null;                 // WebXR anchor (ARCore çapası): dünyaya sabitlenmiş nokta
let capaIsteniyor = false;
let sabitMatris = null;          // çapa desteklenmiyorsa kullanılan sabit poz
let sapmaKare = 0;
const _mat = new THREE.Matrix4();
let hitTestKaynagi = null;
let hitTestIstendi = false;
let isaretBitmap = null;
let oturum = null;

const _poz = new THREE.Vector3(), _don = new THREE.Quaternion(), _olc = new THREE.Vector3(), _ofset = new THREE.Vector3();

baslat();
modeliYukle();
isaretiHazirla();

function baslat() {
  sahne = new THREE.Scene();
  kamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  sahne.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
  const gunes = new THREE.DirectionalLight(0xffffff, 1.5);
  gunes.position.set(0.5, 1, 0.8);
  sahne.add(gunes);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  document.body.appendChild(renderer.domElement);

  // Düğmelere dokunmak sahneye "yerleştir" olarak sayılmasın
  arac.addEventListener('beforexrselect', (e) => e.preventDefault());

  kontrolcu = renderer.xr.getController(0);
  kontrolcu.addEventListener('select', elleYerlestir);
  sahne.add(kontrolcu);

  // Yüzey halkası (elle yerleştirme için)
  halka = new THREE.Mesh(
    new THREE.RingGeometry(0.03, 0.04, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x2ecc71 })
  );
  halka.matrixAutoUpdate = false;
  halka.visible = false;
  sahne.add(halka);

  // İşaretin görüldüğü yerde çizilen çerçeve (kontrol amaçlı)
  const y = ISARET_GENISLIK / 2;
  isaretCerceve = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-y, 0, -y), new THREE.Vector3(y, 0, -y),
      new THREE.Vector3(y, 0, y), new THREE.Vector3(-y, 0, y)
    ]),
    new THREE.LineBasicMaterial({ color: 0x2ecc71 })
  );
  // Kırmızı nokta: işaretin alt kenar ortası (+Z). Kağıtta küp kutusuna bakan kenarda görünmeli.
  const altNokta = new THREE.Mesh(new THREE.SphereGeometry(0.005, 12, 8), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
  altNokta.position.set(0, 0, y);
  isaretCerceve.add(altNokta);
  isaretCerceve.matrixAutoUpdate = false;
  isaretCerceve.visible = false;
  sahne.add(isaretCerceve);

  btnBasla.addEventListener('click', arBaslat);
  btnCik.addEventListener('click', () => { if (oturum) oturum.end(); });
  btnKilitle.addEventListener('click', () => {
    takipModu = 'isaret';
    kilidiAc();
    btnKilitle.disabled = true;
    bilgi.textContent = 'Kamerayı işarete doğrult ve ölçüm bitene kadar sabit tut.';
  });
  btnDondur.addEventListener('click', () => {
    if (yerlesik) model.rotateY(THREE.MathUtils.degToRad(15));
  });
  btnKaldir.addEventListener('click', () => {
    if (yerlesik) {
      sahne.remove(model);
      yerlesik = false;
      takipModu = 'elle';
      btnDondur.disabled = btnKaldir.disabled = true;
      btnKilitle.disabled = false;
      bilgi.textContent = 'Model kaldırıldı. Halkaya dokun ya da İşarete kilitle.';
    }
  });

  window.addEventListener('resize', boyutDegisti);
  renderer.setAnimationLoop(ciz);
}

async function isaretiHazirla() {
  try {
    const img = new Image();
    img.src = ISARET_DOSYA;
    await img.decode();
    isaretBitmap = await createImageBitmap(img);
  } catch (e) {
    durum.textContent = 'İşaret görüntüsü yüklenemedi: ' + ISARET_DOSYA + ' depoda var mı?';
  }
}

async function arBaslat() {
  if (!navigator.xr) { bilgi.textContent = 'Bu tarayıcı WebXR desteklemiyor. Android Chrome kullan.'; return; }
  if (!(await navigator.xr.isSessionSupported('immersive-ar'))) { bilgi.textContent = 'Bu cihazda AR desteklenmiyor.'; return; }

  const temel = { requiredFeatures: ['hit-test', 'dom-overlay'], optionalFeatures: ['anchors'], domOverlay: { root: document.body } };
  try {
    if (!isaretBitmap) throw new Error('işaret yok');
    oturum = await navigator.xr.requestSession('immersive-ar', {
      ...temel,
      requiredFeatures: [...temel.requiredFeatures, 'image-tracking'],
      trackedImages: [{ image: isaretBitmap, widthInMeters: ISARET_GENISLIK }]
    });
    isaretTakibiVar = true;
  } catch (e) {
    // İşaret takibi açılamadı: bayrak kapalı olabilir. Elle yerleştirmeyle devam et.
    try {
      oturum = await navigator.xr.requestSession('immersive-ar', temel);
    } catch (e2) {
      bilgi.textContent = 'AR başlatılamadı: ' + e2.message;
      return;
    }
    isaretTakibiVar = false;
    takipModu = 'elle';
  }

  await renderer.xr.setSession(oturum);
  btnBasla.classList.add('gizli');
  [btnKilitle, btnDondur, btnKaldir, btnCik].forEach(b => b.classList.remove('gizli'));
  btnKilitle.disabled = true;   // zaten işaret modunda; elle yerleştirince açılır

  if (isaretTakibiVar) {
    bilgi.textContent = 'Kamerayı basılı işarete doğrult.';
    durum.textContent = 'İşaret aranıyor...';
    if (oturum.getTrackedImageScores) {
      oturum.getTrackedImageScores().then((puanlar) => {
        if (puanlar[0] === 'untrackable') durum.textContent = 'İşaret görüntüsü takip için uygun bulunmadı.';
      });
    }
  } else {
    bilgi.textContent = 'İşaret takibi kapalı (Chrome bayrağı). Yeşil halka göründüğünde dokunarak yerleştir.';
    durum.textContent = 'Açmak için: chrome://flags → "WebXR Incubations" → Enabled → Chrome\'u yeniden başlat.';
  }

  oturum.addEventListener('end', () => {
    oturum = null;
    hitTestIstendi = false; hitTestKaynagi = null;
    if (yerlesik) { sahne.remove(model); yerlesik = false; }
    takipModu = 'isaret';
    kilidiAc();
    isaretCerceve.visible = false; halka.visible = false;
    btnBasla.classList.remove('gizli');
    [btnKilitle, btnDondur, btnKaldir, btnCik].forEach(b => b.classList.add('gizli'));
    bilgi.textContent = 'AR kapatıldı. Tekrar başlatabilirsin.';
    durum.textContent = '';
  });
}

function modeliYukle() {
  new MTLLoader().load(MODEL_MTL, (malzemeler) => {
    malzemeler.preload();
    const yukleyici = new OBJLoader();
    yukleyici.setMaterials(malzemeler);
    yukleyici.load(MODEL_OBJ, (obj) => {
      obj.scale.setScalar(MODEL_OLCEK);
      const kutu = new THREE.Box3().setFromObject(obj);
      const merkez = kutu.getCenter(new THREE.Vector3());
      obj.position.set(-merkez.x, -kutu.min.y, -merkez.z);   // taban yerde, orta noktada
      model = new THREE.Group();
      model.add(obj);
      const boyut = kutu.getSize(new THREE.Vector3()).multiplyScalar(1000);
      bilgi.textContent = `Model hazır (${boyut.x.toFixed(0)} × ${boyut.y.toFixed(0)} × ${boyut.z.toFixed(0)} mm). AR'ı başlat ve kamerayı işarete doğrult.`;
    },
    (ilerleme) => { if (ilerleme.total) bilgi.textContent = `Model yükleniyor %${Math.round(100 * ilerleme.loaded / ilerleme.total)}`; },
    () => { bilgi.textContent = 'Model yüklenemedi: ' + MODEL_OBJ + ' depoda var mı?'; });
  }, undefined, () => { bilgi.textContent = 'Renk dosyası yüklenemedi: ' + MODEL_MTL + ' depoda var mı?'; });
}

function modeliGoster() {
  if (!yerlesik) {
    sahne.add(model);
    yerlesik = true;
    btnDondur.disabled = btnKaldir.disabled = false;
  }
}

// Verilen işaret pozundan (matris) modeli yerleştir: işaret merkezinden sayfa boyunca aşağı (+Z) PARCA_OFSET kadar
function modeliIsaretPozunaKoy(matris) {
  matris.decompose(_poz, _don, _olc);
  _ofset.set(0, 0, PARCA_OFSET).applyQuaternion(_don);   // sayfada aşağı = +Z
  model.position.copy(_poz).add(_ofset);
  model.quaternion.copy(_don);
  model.scale.set(1, 1, 1);
  modeliGoster();
}

// İşaret her karede görüldüğünde çağrılır. Önce ORNEK_SAYISI kare ölçüm toplar, ortalamasını alır,
// sonra o pozu ARCore çapasına (anchor) bağlar. Çapa, dünyadaki sabit bir noktadır: ARCore kendi
// haritasını düzelttiğinde çapayı da taşır, bu yüzden model kağıda göre kaymaz. Kilitlendikten sonra
// işaretin anlık ölçümleri modele yansımaz; yalnızca kağıt gerçekten oynamışsa yeniden kilitlenir.
function isaretGoruldu(poz, frame, referansAlani) {
  const t = poz.transform;
  if (!kilitli) {
    if (capaIsteniyor) return;
    ornekler.push({ p: [t.position.x, t.position.y, t.position.z], q: [t.orientation.x, t.orientation.y, t.orientation.z, t.orientation.w] });
    durum.textContent = `İşaret ölçülüyor ${ornekler.length}/${ORNEK_SAYISI} — telefonu sabit tut`;
    if (ornekler.length >= ORNEK_SAYISI) kilitle(ortalamaPoz(ornekler), frame, referansAlani);
    return;
  }
  // Kilitli: kağıt oynamış mı? İşaretin görülen konumu kilitli konumdan uzun süre uzaksa yeniden kilitle
  const kilitliPoz = capa ? frame.getPose(capa.anchorSpace, referansAlani) : null;
  const kp = kilitliPoz ? kilitliPoz.transform.position : (sabitMatris ? { x: sabitMatris.elements[12], y: sabitMatris.elements[13], z: sabitMatris.elements[14] } : null);
  if (kp) {
    const d = Math.hypot(t.position.x - kp.x, t.position.y - kp.y, t.position.z - kp.z);
    sapmaKare = d > YENIDEN_KILIT_M ? sapmaKare + 1 : 0;
    if (sapmaKare >= YENIDEN_KILIT_KARE) {
      kilidiAc();
      bilgi.textContent = 'İşaret yer değiştirmiş görünüyor, yeniden ölçülüyor. Telefonu sabit tut.';
    }
  }
}

// Konumların ortancası (uç ölçümleri eler) ve yönelimlerin ortalaması
function ortalamaPoz(ornekler) {
  const ortanca = (dizi) => { const s = [...dizi].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; };
  const p = [0, 1, 2].map(i => ortanca(ornekler.map(o => o.p[i])));
  const q0 = ornekler[0].q;
  const q = [0, 0, 0, 0];
  for (const o of ornekler) {
    const isaret = (o.q[0]*q0[0] + o.q[1]*q0[1] + o.q[2]*q0[2] + o.q[3]*q0[3]) < 0 ? -1 : 1;
    for (let i = 0; i < 4; i++) q[i] += isaret * o.q[i];
  }
  const n = Math.hypot(...q);
  return { position: { x: p[0], y: p[1], z: p[2], w: 1 }, orientation: { x: q[0]/n, y: q[1]/n, z: q[2]/n, w: q[3]/n } };
}

function kilitle(poz, frame, referansAlani) {
  const sabitle = () => {
    sabitMatris = new THREE.Matrix4().compose(
      new THREE.Vector3(poz.position.x, poz.position.y, poz.position.z),
      new THREE.Quaternion(poz.orientation.x, poz.orientation.y, poz.orientation.z, poz.orientation.w),
      new THREE.Vector3(1, 1, 1));
    kilitli = true; capaIsteniyor = false;
    durum.textContent = 'İşarete kilitlendi (sabit poz)';
  };
  if (typeof frame.createAnchor === 'function') {
    capaIsteniyor = true;
    frame.createAnchor(new XRRigidTransform(poz.position, poz.orientation), referansAlani)
      .then((a) => { capa = a; kilitli = true; capaIsteniyor = false; durum.textContent = 'İşarete kilitlendi (çapa). Artık serbestçe dolaşabilirsin.'; })
      .catch(sabitle);
  } else {
    sabitle();
  }
  bilgi.textContent = 'Model işarete göre yerleşti. Küpü kağıttaki kutuya koy ve karşılaştır.';
}

function kilidiAc() {
  if (capa && typeof capa.delete === 'function') { try { capa.delete(); } catch (e) {} }
  capa = null; sabitMatris = null; kilitli = false; capaIsteniyor = false;
  ornekler = []; sapmaKare = 0;
}

function elleYerlestir() {
  if (!model || !halka.visible) return;
  halka.matrix.decompose(model.position, model.quaternion, model.scale);
  takipModu = 'elle';
  btnKilitle.disabled = !isaretTakibiVar;
  modeliGoster();
  bilgi.textContent = 'Elle yerleştirildi. Döndür ile hizala; işarete geri dönmek için İşarete kilitle.';
}

function boyutDegisti() {
  kamera.aspect = window.innerWidth / window.innerHeight;
  kamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function ciz(zaman, frame) {
  if (frame && oturum) {
    const referansAlani = renderer.xr.getReferenceSpace();

    // Yüzey halkası
    if (!hitTestIstendi) {
      oturum.requestReferenceSpace('viewer').then((bakisAlani) => {
        oturum.requestHitTestSource({ space: bakisAlani }).then((kaynak) => { hitTestKaynagi = kaynak; });
      });
      hitTestIstendi = true;
    }
    if (hitTestKaynagi) {
      const sonuclar = frame.getHitTestResults(hitTestKaynagi);
      if (sonuclar.length) {
        halka.visible = true;
        halka.matrix.fromArray(sonuclar[0].getPose(referansAlani).transform.matrix);
      } else {
        halka.visible = false;
      }
    }

    // İşaret takibi
    if (isaretTakibiVar && typeof frame.getImageTrackingResults === 'function') {
      let durumMetni = 'İşaret görünmüyor';
      for (const sonuc of frame.getImageTrackingResults()) {
        if (sonuc.index !== 0) continue;
        const poz = frame.getPose(sonuc.imageSpace, referansAlani);
        if (!poz) continue;
        if (sonuc.trackingState === 'tracked') {
          isaretCerceve.matrix.fromArray(poz.transform.matrix);
          isaretCerceve.visible = true;
          if (model && takipModu === 'isaret') isaretGoruldu(poz, frame, referansAlani);
          durumMetni = kilitli ? `İşaret görüldü (ölçülen genişlik ${(sonuc.measuredWidthInMeters * 1000).toFixed(0)} mm)` : '';
        } else {
          durumMetni = kilitli ? 'İşaret görüş dışında, çapa takipte' : 'İşaret görünmüyor';
        }
      }
      if (durumMetni && durumMetni !== sonIsaretDurumu) {
        sonIsaretDurumu = durumMetni;
        durum.textContent = durumMetni;
      }

      // Kilitliyse model her karede çapanın (ya da sabit pozun) yerine oturur; işaret görünmese de.
      if (kilitli && model && takipModu === 'isaret') {
        if (capa) {
          const cp = frame.getPose(capa.anchorSpace, referansAlani);
          if (cp) { _mat.fromArray(cp.transform.matrix); modeliIsaretPozunaKoy(_mat); }
        } else if (sabitMatris) {
          modeliIsaretPozunaKoy(sabitMatris);
        }
      }
    }
  }
  renderer.render(sahne, kamera);
}
</script>
</body>
</html>
