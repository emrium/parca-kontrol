<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parça Kontrol – Model Yerleştirme</title>
<style>
  body { margin: 0; background: #1c1f24; color: #e8e8e8; font-family: system-ui, sans-serif; }
  #bilgi {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 14px 16px; font-size: 15px; line-height: 1.4; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  #arac {
    position: absolute; bottom: 80px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 10px;
  }
  #arac button {
    padding: 12px 18px; font-size: 15px; border: 0; border-radius: 8px;
    background: rgba(255,255,255,.9); color: #1c1f24;
  }
  #arac button:disabled { opacity: .4; }
</style>
</head>
<body>
<div id="bilgi">Model yükleniyor...</div>
<div id="arac">
  <button id="dondur" disabled>Döndür 15°</button>
  <button id="kaldir" disabled>Kaldır</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

// ---- Ayarlar: gerçek parçaya geçince burayı değiştirmek yeter ----
const MODEL_OBJ = 'parca.obj';
const MODEL_MTL = 'parca.mtl';
const MODEL_OLCEK = 0.001;      // model mm ise 0.001 (Three.js metre kullanır), cm ise 0.01
// -------------------------------------------------------------------

const bilgi = document.getElementById('bilgi');
const arac = document.getElementById('arac');
const btnDondur = document.getElementById('dondur');
const btnKaldir = document.getElementById('kaldir');

let kamera, sahne, renderer, kontrolcu, halka;
let model = null;          // yüklenen model (henüz sahnede değil)
let yerlesik = false;      // model sahneye yerleştirildi mi
let hitTestKaynagi = null;
let hitTestIstendi = false;

baslat();
modeliYukle();

function baslat() {
  sahne = new THREE.Scene();
  kamera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

  sahne.add(new THREE.HemisphereLight(0xffffff, 0x666666, 2.2));
  const gunes = new THREE.DirectionalLight(0xffffff, 1.5);
  gunes.position.set(0.5, 1, 0.8);
  sahne.add(gunes);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  // dom-overlay: AR açıkken üstteki yazı ve düğmeler görünür kalır
  document.body.appendChild(ARButton.createButton(renderer, {
    requiredFeatures: ['hit-test'],
    optionalFeatures: ['dom-overlay'],
    domOverlay: { root: document.body }
  }));

  // Düğmelere dokunmak sahneye "yerleştir" olarak sayılmasın
  arac.addEventListener('beforexrselect', (e) => e.preventDefault());

  kontrolcu = renderer.xr.getController(0);
  kontrolcu.addEventListener('select', yerlestir);
  sahne.add(kontrolcu);

  halka = new THREE.Mesh(
    new THREE.RingGeometry(0.03, 0.04, 32).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color: 0x2ecc71 })
  );
  halka.matrixAutoUpdate = false;
  halka.visible = false;
  sahne.add(halka);

  btnDondur.addEventListener('click', () => {
    if (yerlesik) model.rotateY(THREE.MathUtils.degToRad(15));
  });
  btnKaldir.addEventListener('click', () => {
    if (yerlesik) {
      sahne.remove(model);
      yerlesik = false;
      btnDondur.disabled = btnKaldir.disabled = true;
      bilgi.textContent = 'Yeşil halka göründüğünde ekrana dokun.';
    }
  });

  window.addEventListener('resize', boyutDegisti);
  renderer.setAnimationLoop(ciz);
}

function modeliYukle() {
  new MTLLoader().load(MODEL_MTL, (malzemeler) => {
    malzemeler.preload();
    const yukleyici = new OBJLoader();
    yukleyici.setMaterials(malzemeler);
    yukleyici.load(MODEL_OBJ, (obj) => {
      obj.scale.setScalar(MODEL_OLCEK);

      // Modeli tabanı yerde, ortası halkanın ortasında olacak şekilde kaydır
      const kutu = new THREE.Box3().setFromObject(obj);
      const merkez = kutu.getCenter(new THREE.Vector3());
      obj.position.set(-merkez.x, -kutu.min.y, -merkez.z);

      model = new THREE.Group();
      model.add(obj);

      const boyut = kutu.getSize(new THREE.Vector3()).multiplyScalar(1000);
      bilgi.textContent = `Model hazır (${boyut.x.toFixed(0)} × ${boyut.y.toFixed(0)} × ${boyut.z.toFixed(0)} mm). START AR'a bas, yeşil halka göründüğünde ekrana dokun.`;
    },
    (ilerleme) => {
      if (ilerleme.total) bilgi.textContent = `Model yükleniyor %${Math.round(100 * ilerleme.loaded / ilerleme.total)}`;
    },
    (hata) => { bilgi.textContent = 'Model yüklenemedi: ' + MODEL_OBJ + ' dosyası depoda var mı?'; });
  },
  undefined,
  (hata) => { bilgi.textContent = 'Renk dosyası yüklenemedi: ' + MODEL_MTL + ' depoda var mı?'; });
}

function yerlestir() {
  if (!model || !halka.visible) return;
  halka.matrix.decompose(model.position, model.quaternion, model.scale);
  if (!yerlesik) {
    sahne.add(model);
    yerlesik = true;
    btnDondur.disabled = btnKaldir.disabled = false;
  }
  bilgi.textContent = 'Model yerleşti. Gerçek parçayla hizalamak için Döndür, taşımak için başka yere dokun.';
}

function boyutDegisti() {
  kamera.aspect = window.innerWidth / window.innerHeight;
  kamera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function ciz(zaman, frame) {
  if (frame) {
    const referansAlani = renderer.xr.getReferenceSpace();
    const oturum = renderer.xr.getSession();

    if (!hitTestIstendi) {
      oturum.requestReferenceSpace('viewer').then((bakisAlani) => {
        oturum.requestHitTestSource({ space: bakisAlani }).then((kaynak) => { hitTestKaynagi = kaynak; });
      });
      oturum.addEventListener('end', () => { hitTestIstendi = false; hitTestKaynagi = null; });
      hitTestIstendi = true;
    }

    if (hitTestKaynagi) {
      const sonuclar = frame.getHitTestResults(hitTestKaynagi);
      if (sonuclar.length) {
        halka.visible = true;
        halka.matrix.fromArray(sonuclar[0].getPose(referansAlani).transform.matrix);
      } else {
        halka.visible = false;
      }
    }
  }
  renderer.render(sahne, kamera);
}
</script>
</body>
</html>
